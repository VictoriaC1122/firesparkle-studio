<!doctype html>
<!-- 分享預覽圖（1200×630）的版型。由 scripts/render-og.py 以無頭瀏覽器輸出 public/assets/brand/og-image.png -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: "Times New Roman", Tinos, Times, "Noto Serif TC Variable", "Noto Serif CJK TC", serif; color: #1b1a1f; background: #f7f5f0; }
  .aurora { display: none; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 460px; align-items: center; padding: 0 96px; gap: 24px; }
  .eyebrow { font-size: 15px; font-weight: 400; letter-spacing: .22em; white-space: nowrap; text-transform: uppercase; color: #726f78; margin: 0 0 26px; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: #9a7d49; }
  h1 { margin: 0 0 26px; font-size: 76px; line-height: 1.04; font-weight: 400; letter-spacing: -.01em; }
  h1 em { font-style: italic; color: #7a6133; }
  .zh { font-size: 24px; font-weight: 500; letter-spacing: .04em; color: #3f3d45; margin: 0 0 20px; line-height: 1.6; }
  .zh b { display: block; font-size: 30px; font-weight: 600; color: #1b1a1f; }
  .url { font-size: 20px; letter-spacing: .08em; color: #726f78; margin: 0; }
  .art { position: relative; width: 460px; height: 460px; display: grid; place-items: center; }
  .art::before { content: ""; position: absolute; inset: 16%; border-radius: 50%; background: radial-gradient(closest-side, rgba(214,170,150,.3), rgba(190,176,214,.2) 55%, transparent 100%); filter: blur(22px); }
  .art::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 1px solid rgba(27,26,31,.22); }
  .logo { position: relative; width: 240px; filter: drop-shadow(0 24px 34px rgba(120,100,140,.28)); }
  .icon { position: absolute; width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 12px 24px -14px rgba(27,26,31,.45); }
</style></head><body>
<div class="aurora"></div>
<div class="grid">
  <div>
    <p class="eyebrow">Independent app &amp; game studio · Est. 2026</p>
    <h1>Small sparks,<br><em>big ideas.</em></h1>
    <p class="zh"><b>花火工作室</b>將微小的靈感火花，化為精彩的創意</p>
    <p class="url">firesparkle.com</p>
  </div>
  <div class="art">
    <img class="logo" src="/assets/brand/icon-512.png" alt="">
    <!-- 依 src/content.mjs 作品排序（銷售數量）的前 6 款 -->
    <img class="icon" style="top:2%;left:46%" src="/assets/apps/6756014104.jpg" alt="">
    <img class="icon" style="top:16%;left:82%" src="/assets/apps/6755403297.jpg" alt="">
    <img class="icon" style="top:50%;left:93%" src="/assets/apps/6761377948.jpg" alt="">
    <img class="icon" style="top:80%;left:76%" src="/assets/apps/6761411130.jpg" alt="">
    <img class="icon" style="top:88%;left:40%" src="/assets/apps/6761441866.jpg" alt="">
    <img class="icon" style="top:72%;left:6%" src="/assets/apps/6815299678.jpg" alt="">
  </div>
</div>
</body></html>
